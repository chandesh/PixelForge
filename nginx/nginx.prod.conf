# TLS is expected to terminate at a load balancer or reverse proxy in front of
# this container. Forward X-Forwarded-Proto so Django can detect HTTPS.
map $http_x_forwarded_proto $pf_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Angular SPA is served by the frontend container.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pf_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend:8383;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pf_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://backend:8383/static/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
}
